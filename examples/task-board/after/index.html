<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow</title>
<style>
:root {
  --canvas: #0a0c11;
  --glass: linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
  --row: rgba(255, 255, 255, 0.05);
  --field: rgba(0, 0, 0, 0.28);
  --edge: rgba(255, 255, 255, 0.14);
  --ink: #f2f4f8;
  --ink-muted: #aab1c0;
  --violet: #8b7cff;
  --teal: #3fd6c4;
  --accent: linear-gradient(120deg, var(--violet), var(--teal));
  --work: #6cb4ff; --personal: #5fe0a0; --health: #ff7fb0; --study: #b69cff; --ideas: #ffc15e; --urgent: #ff7b72;
  --low: #5fe0a0; --medium: #ffc15e; --high: #ff7b72;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; color: var(--ink); font: 450 15px/1.4 Inter, "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(60% 50% at 12% 8%, rgba(139, 124, 255, 0.42), transparent 70%),
    radial-gradient(55% 55% at 92% 88%, rgba(63, 214, 196, 0.30), transparent 70%),
    var(--canvas);
  background-attachment: fixed;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 288px 1fr; gap: 20px; max-width: 1120px; margin: 0 auto; padding: 40px 24px; align-items: start; }
.rail, .stage {
  background: var(--glass); border: 1px solid var(--edge); border-radius: 22px; padding: 26px;
  backdrop-filter: blur(22px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 24px 60px rgba(0, 0, 0, 0.35);
}
.rail { display: grid; gap: 22px; }
.stage { min-height: 560px; display: grid; gap: 16px; align-content: start; }

.brand h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
.brand p { margin-top: 4px; color: var(--ink-muted); font-size: 13px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 14px; border-radius: 16px; background: var(--row); border: 1px solid rgba(255, 255, 255, 0.1); }
.stat b { display: block; font-size: 34px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; }
.stat span { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.stat:nth-child(2) b { background: var(--accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat:nth-child(4) b { color: var(--urgent); }
.progress { margin-top: 14px; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.progress div { height: 100%; width: 0; border-radius: inherit; background: var(--accent); box-shadow: 0 0 14px rgba(63, 214, 196, 0.5); transition: width 0.4s; }
#summary { margin-top: 8px; color: var(--ink-muted); font-size: 13px; }

.group-label { margin-bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
.pills { display: grid; gap: 6px; }
.pill { text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--ink-muted); }
.pill:hover { background: rgba(255, 255, 255, 0.06); }
.pill.active { color: var(--ink); background: rgba(255, 255, 255, 0.1); border-color: var(--edge); }

.tag { --h: var(--ink-muted); display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--h);
  background: color-mix(in srgb, var(--h) 16%, transparent); border: 1px solid color-mix(in srgb, var(--h) 40%, transparent); }
.tag.work { --h: var(--work); } .tag.personal { --h: var(--personal); } .tag.health { --h: var(--health); }
.tag.study { --h: var(--study); } .tag.ideas { --h: var(--ideas); } .tag.urgent { --h: var(--urgent); }
.tag.all { --h: var(--ink-muted); }
.tag-filters { display: flex; flex-wrap: wrap; gap: 8px; }
.tag-filters .tag { cursor: pointer; opacity: 0.7; transition: opacity 0.15s; }
.tag-filters .tag:hover { opacity: 0.85; }
.tag-filters .tag.active { opacity: 1; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22); }

.clear { padding: 10px; border-radius: 12px; border: 1px solid var(--edge); background: transparent; color: var(--ink-muted); }
.clear:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }

input, select { background: var(--field); border: 1px solid var(--edge); border-radius: 12px; padding: 12px 14px; outline: none; }
input::placeholder { color: var(--ink-muted); }
input:focus-visible, select:focus-visible { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 124, 255, 0.3); outline: none; }
select { color: var(--ink-muted); }
select option { background: #151821; color: var(--ink); }
@supports (appearance: base-select) {
  select, ::picker(select) { appearance: base-select; }
  ::picker(select) { background: #151821; border: 1px solid var(--edge); border-radius: 12px; padding: 6px; color: var(--ink); }
  select option { padding: 8px 12px; border-radius: 8px; }
  select option:hover, select option:checked { background: rgba(255, 255, 255, 0.1); }
}
input[type=date] { color-scheme: dark; color: var(--ink-muted); }

.add-form { display: grid; grid-template-columns: 120px 130px 150px 1fr; gap: 10px; }
.add-form #title { grid-column: 1 / -1; padding: 16px 18px; font-size: 17px; border-radius: 16px; }
.add-form button { justify-self: end; padding: 12px 26px; border: 0; border-radius: 12px; font-weight: 650; color: var(--canvas); background: var(--accent); }
.add-form button:hover { filter: brightness(1.1); }

.controls { display: flex; gap: 10px; }
.controls input { flex: 1; min-width: 0; }

.list { list-style: none; display: grid; gap: 10px; }
.item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--row); border: 1px solid rgba(255, 255, 255, 0.1); transition: background 0.15s, transform 0.15s; }
.item:hover { background: rgba(255, 255, 255, 0.09); transform: translateY(-1px); }
.item input[type=checkbox] { appearance: none; flex: none; width: 22px; height: 22px; padding: 0; border-radius: 50%; border: 1.5px solid var(--ink-muted); background: transparent; cursor: pointer; }
.item input[type=checkbox]:checked { border-color: transparent; background: var(--accent); box-shadow: 0 0 14px rgba(63, 214, 196, 0.5); }
.title { flex: 1; min-width: 0; }
.item.done .title { text-decoration: line-through; color: var(--ink-muted); }
.item.done .tag, .item.done .badge { opacity: 0.55; }
.badge { --h: var(--medium); padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--h);
  background: color-mix(in srgb, var(--h) 16%, transparent); border: 1px solid color-mix(in srgb, var(--h) 40%, transparent); }
.badge.low { --h: var(--low); } .badge.medium { --h: var(--medium); } .badge.high { --h: var(--high); }
.due { min-width: 92px; text-align: right; font-size: 13px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.due.overdue { color: var(--urgent); font-weight: 600; }
.del { padding: 2px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink-muted); font-size: 20px; line-height: 1; opacity: 0; transition: opacity 0.15s; }
.item:hover .del, .del:focus-visible { opacity: 1; }
.del:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
@media (hover: none) { .del { opacity: 1; } }
.empty { padding: 48px 16px; text-align: center; color: var(--ink-muted); }

@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding: 20px 16px; }
  .rail, .stage { padding: 20px; }
  .add-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .add-form button { grid-column: 1 / -1; justify-self: stretch; }
  .item { flex-wrap: wrap; }
  .title { flex: 1 1 calc(100% - 80px); }
  .due { min-width: 0; margin-left: auto; }
}
@media (prefers-reduced-motion: reduce) { .item, .del, .progress div, .tag-filters .tag { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <h1>TaskFlow</h1>
      <p>Organize your work, achieve your goals</p>
    </div>

    <div>
      <div class="stats">
        <div class="stat"><b id="sTotal">0</b><span>Total</span></div>
        <div class="stat"><b id="sActive">0</b><span>Active</span></div>
        <div class="stat"><b id="sDone">0</b><span>Completed</span></div>
        <div class="stat"><b id="sLate">0</b><span>Overdue</span></div>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <p id="summary"></p>
    </div>

    <div>
      <p class="group-label">Show</p>
      <div class="pills" id="statusFilters">
        <button type="button" class="pill active" data-status="all">All</button>
        <button type="button" class="pill" data-status="active">Active</button>
        <button type="button" class="pill" data-status="done">Completed</button>
      </div>
    </div>

    <div>
      <p class="group-label">Tags</p>
      <div class="tag-filters" id="tagFilters"></div>
    </div>

    <button class="clear" id="clear">Clear completed</button>
  </aside>

  <main class="stage">
    <form class="add-form" id="addForm">
      <input id="title" placeholder="What needs to be done?" autocomplete="off" required>
      <select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
      <select id="tag"></select>
      <input id="due" type="date">
      <button>Add Task</button>
    </form>

    <div class="controls">
      <input id="search" placeholder="Search tasks...">
      <select id="sort"><option value="created">Newest</option><option value="due">Due date</option><option value="priority">Priority</option></select>
    </div>

    <ul class="list" id="list"></ul>
  </main>
</div>

<script>
const TAGS = ['work', 'personal', 'health', 'study', 'ideas', 'urgent'];
const RANK = { high: 0, medium: 1, low: 2 };
const KEY = 'taskflow.v1';
const $ = (s) => document.querySelector(s);
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const day = (n) => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);

let tasks = JSON.parse(localStorage.getItem(KEY) || 'null') || [
  { id: 1, title: 'Finish the quarterly report', priority: 'high', tag: 'work', due: day(-1), done: false, createdAt: 6 },
  { id: 2, title: 'Book a dentist appointment', priority: 'medium', tag: 'health', due: day(3), done: false, createdAt: 5 },
  { id: 3, title: 'Read chapter 4 of Operating Systems', priority: 'medium', tag: 'study', due: day(5), done: false, createdAt: 4 },
  { id: 4, title: 'Sketch the new landing page', priority: 'low', tag: 'ideas', due: '', done: true, createdAt: 3 },
  { id: 5, title: 'Pay the electricity bill', priority: 'high', tag: 'urgent', due: day(1), done: false, createdAt: 2 },
  { id: 6, title: 'Call mum on Sunday', priority: 'low', tag: 'personal', due: day(6), done: true, createdAt: 1 }
];
let status = 'all', tagFilter = 'all';

const save = () => localStorage.setItem(KEY, JSON.stringify(tasks));
const overdue = (t) => !t.done && t.due && t.due < day(0);

$('#tag').innerHTML = TAGS.map((t) => `<option value="${t}">${t[0].toUpperCase() + t.slice(1)}</option>`).join('');
$('#tagFilters').innerHTML = ['all', ...TAGS].map((t) => `<span class="tag ${t}" data-tag="${t}">${t}</span>`).join('');

function render() {
  const q = $('#search').value.trim().toLowerCase();
  const sort = $('#sort').value;
  const shown = tasks
    .filter((t) => status === 'all' || (status === 'done') === t.done)
    .filter((t) => tagFilter === 'all' || t.tag === tagFilter)
    .filter((t) => t.title.toLowerCase().includes(q))
    .sort((a, b) => sort === 'priority' ? RANK[a.priority] - RANK[b.priority]
      : sort === 'due' ? (a.due || '9').localeCompare(b.due || '9')
      : b.createdAt - a.createdAt);

  $('#list').innerHTML = shown.length ? shown.map((t) => `
    <li class="item ${t.priority}${t.done ? ' done' : ''}" data-id="${t.id}">
      <input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Toggle">
      <span class="title">${esc(t.title)}</span>
      <span class="tag ${t.tag}">${t.tag}</span>
      <span class="badge ${t.priority}">${t.priority}</span>
      ${t.due ? `<span class="due${overdue(t) ? ' overdue' : ''}">${overdue(t) ? 'Overdue ' : ''}${t.due.slice(5)}</span>` : ''}
      <button class="del" aria-label="Delete">&times;</button>
    </li>`).join('') : '<li class="empty">No tasks match. Nice and clear!</li>';

  document.querySelectorAll('#statusFilters .pill').forEach((b) => b.classList.toggle('active', b.dataset.status === status));
  document.querySelectorAll('#tagFilters .tag').forEach((b) => b.classList.toggle('active', b.dataset.tag === tagFilter));

  const done = tasks.filter((t) => t.done).length;
  $('#sTotal').textContent = tasks.length;
  $('#sActive').textContent = tasks.length - done;
  $('#sDone').textContent = done;
  $('#sLate').textContent = tasks.filter(overdue).length;
  $('#bar').style.width = (tasks.length ? Math.round((done / tasks.length) * 100) : 0) + '%';
  $('#summary').textContent = `${done} of ${tasks.length} tasks completed`;
}

$('#addForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const title = $('#title').value.trim();
  if (!title) return;
  tasks.push({ id: Date.now(), title, priority: $('#priority').value, tag: $('#tag').value, due: $('#due').value, done: false, createdAt: Date.now() });
  e.target.reset();
  save(); render();
});
$('#list').addEventListener('click', (e) => {
  const li = e.target.closest('.item');
  if (!li) return;
  const t = tasks.find((x) => x.id == li.dataset.id);
  if (e.target.closest('.del')) tasks = tasks.filter((x) => x !== t);
  else if (e.target.type === 'checkbox') t.done = !t.done;
  else return;
  save(); render();
});
$('#list').addEventListener('dblclick', (e) => {
  const title = e.target.closest('.title');
  if (!title) return;
  const t = tasks.find((x) => x.id == title.parentElement.dataset.id);
  const next = prompt('Edit task', t.title);
  if (next && next.trim()) { t.title = next.trim(); save(); render(); }
});
$('#statusFilters').addEventListener('click', (e) => { if (e.target.dataset.status) { status = e.target.dataset.status; render(); } });
$('#tagFilters').addEventListener('click', (e) => { if (e.target.dataset.tag) { tagFilter = e.target.dataset.tag; render(); } });
$('#search').addEventListener('input', render);
$('#sort').addEventListener('change', render);
$('#clear').addEventListener('click', () => { tasks = tasks.filter((t) => !t.done); save(); render(); });
render();
</script>
</body>
</html>
